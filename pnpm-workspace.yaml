packages:
  - "packages/*"
  - "apps/*"
  - "evals"

# esbuild's postinstall only fetches a fallback binary. The real one arrives via
# its platform optional dependency, so skipping the script is a decision rather
# than an oversight, and an ignored build should not fail the install.
ignoredBuiltDependencies:
  - esbuild
strictDepBuilds: false
